<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strong — avant / après</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>Strong — avant / après</h1>
        <select id="bible" aria-label="Bible"></select>
        <button id="prev" aria-label="Chapitre précédent">‹</button>
        <select id="book" aria-label="Livre"></select>
        <select id="chapter" aria-label="Chapitre"></select>
        <button id="next" aria-label="Chapitre suivant">›</button>
        <span class="seg" role="tablist">
          <button data-mode="after" class="on">Après</button>
          <button data-mode="before">Avant</button>
          <button data-mode="compare">Comparer</button>
        </span>
        <label class="check"
          ><input type="checkbox" id="numbers" checked /> numéros</label
        >
        <label class="check"
          ><input type="checkbox" id="uncertain" checked /> incertains</label
        >
        <label class="check"
          ><input type="checkbox" id="changedOnly" /> versets modifiés</label
        >
        <a href="/concordance">S21 et NEG79 face à Concordance ›</a>
      </div>
      <div class="stats" id="stats"></div>
      <div class="legend">
        <span
          ><i class="sw" style="background: var(--transfer)"></i>transféré d'un
          témoin</span
        >
        <span
          ><i class="sw" style="background: var(--learned)"></i>appris ou
          lexique</span
        >
        <span
          ><i class="sw" style="background: var(--locution)"></i>locution
          entière (E)</span
        >
        <span
          ><b style="color: var(--empty-witness)">◎</b> non traduit, établi par
          les témoins (G)</span
        >
        <span
          ><b style="color: var(--empty-rule)">◎</b> non traduit, règle
          grammaticale</span
        >
        <span
          ><b class="uncertain-sign" style="color: var(--uncertain)">◌</b>
          incertain, position estimée</span
        >
        <span
          ><i class="sw" style="background: var(--changed)"></i>changé depuis «
          avant »</span
        >
      </div>
    </header>
    <main>
      <div class="examples" id="examples"></div>
      <div id="verses"><div class="empty-state">Chargement…</div></div>
    </main>
    <aside id="detail" aria-live="polite">
      <button class="close" aria-label="Fermer">×</button>
      <div id="detailBody"></div>
    </aside>
    <script>
      const $ = (id) => document.getElementById(id);
      const state = {
        catalog: [],
        bible: "nbs",
        book: "Gen",
        chapter: 1,
        mode: "after",
        verses: []
      };
      const EXAMPLES = [
        ["nbs", "Gen", 12, 8, "N : « Beth-El » porte les deux mots source"],
        ["nbs", "Gen", 9, 21, "M : « tente », ketiv et qere attestés"],
        ["nbs", "Gen", 5, 15, "O : « soixante-cinq » par sa valeur"],
        ["nfc", "Gen", 7, 11, "NFC, O : « dix-septième », « deuxième »"],
        ["nfc", "Gen", 4, 19, "NFC, P : « Silla » pour Tsilla"],
        ["nbs", "Gen", 2, 4, "Q : « généalogie » entre ses voisins"],
        ["nfc", "Gen", 1, 2, "NFC, Q : « obscurité » (lexique)"],
        ["nbs", "Matt", 1, 12, "R : l'article sur le déterminant"],
        ["nbs", "Gen", 1, 4, "S : le second « entre » non traduit"]
      ];
      /** STEP separates morphemes with "/" and "\\"; the reader sees the word. */
      const word = (s) => String(s || "").replace(/[\/\\]/g, "");
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
        );
      const fmt = (n) => (n == null ? "—" : Number(n).toLocaleString("fr-FR"));
      const pct = (a, b) =>
        b
          ? ((100 * a) / b).toLocaleString("fr-FR", {
              maximumFractionDigits: 1
            }) + " %"
          : "—";
      const ASSURANCE = {
        "witness-empty-transfer":
          "établi par les témoins (G, ou S en contexte plus faible)",
        "linguistic-rule": "règle grammaticale",
        "existing-generator": "porteur du générateur",
        "exact-witness-families-and-source":
          "transfert exact, deux familles de témoins",
        "validated-deterministic-lexical": "lexique validé",
        "lexical-gap-fill": "seul mot libre entre voisins placés, lexique (Q)",
        "witness-attested-reading":
          "lecture ouverte attestée par deux familles de témoins (M)",
        "witness-compound-word": "mot composé des témoins (N)",
        "witness-article-determiner":
          "article sur le déterminant de son nom (R)",
        unresolved: "incertain"
      };
      const METHOD = {
        exact: "transfert exact d'un témoin",
        window: "transfert par voisinage",
        stem: "transfert par radical",
        lexicon: "lexique des témoins",
        "learned-translation": "traduction apprise",
        "learned-translation-stem": "traduction apprise (radical)",
        "learned-phrase": "locution apprise"
      };
      const UNCERTAIN_BASIS = {
        witnesses: "d'après la place que lui donnent les témoins",
        editorial: "place éditoriale conservée",
        "next-source-word":
          "juste avant le mot qui traduit le mot source suivant",
        "previous-source-word":
          "juste après le mot qui traduit le mot source précédent",
        "no-placed-neighbor": "aucun mot voisin placé"
      };
      const kindOf = (c) =>
        c.locution ? "loc" : c.source === "reference-transfer" ? "" : "learned";
      const key = (c) => `${c.strong}|${c.start}|${c.end}`;

      async function api(path) {
        const response = await fetch(path);
        if (!response.ok) throw new Error(await response.text());
        return response.json();
      }

      function stats() {
        const b = state.catalog.find((x) => x.id === state.bible);
        if (!b) return;
        const s = b.summary,
          a = s.after || {},
          p = s.before || {};
        const row = (label, k) =>
          `<span>${label} <b>${fmt(p[k])}</b> → <b>${fmt(a[k])}</b></span>`;
        $("stats").innerHTML =
          `<span><b>${esc(b.label)}</b> · ${fmt(a.verses)} versets, ${fmt(a.units)} mots source · avant : ${esc(b.runs.before)} · après : ${esc(b.runs.after)}</span>` +
          row("placés", "visible") +
          row("non traduits", "empty") +
          row("incertains", "unresolved") +
          `<span>incertitude <b>${pct(p.unresolved, p.units)}</b> → <b>${pct(a.unresolved, a.units)}</b></span>`;
      }

      function diff(v) {
        if (!v.before)
          return {
            badges: [],
            changedCarriers: new Set(),
            changedEmpties: new Set()
          };
        const before = new Map(v.before.carriers.map((c) => [key(c), c]));
        const badges = [];
        const changedCarriers = new Set();
        let loc = 0,
          ident = 0,
          other = 0;
        for (const c of v.after.carriers) {
          const old = before.get(key(c));
          if (!old) {
            changedCarriers.add(key(c));
            c.locution ? loc++ : other++;
          } else if (old.unit !== c.unit) {
            changedCarriers.add(key(c));
            ident++;
          }
        }
        // A word carrier widened into a locution is a change, not a removal.
        const removed = v.before.carriers.filter(
          (c) =>
            !v.after.carriers.some(
              (n) =>
                key(n) === key(c) ||
                (n.locution &&
                  n.strong === c.strong &&
                  n.start <= c.start &&
                  n.end >= c.end)
            )
        ).length;
        const oldEmpties = new Set(v.before.empties.map((e) => e.unit));
        const changedEmpties = new Set(
          v.after.empties
            .filter((e) => !oldEmpties.has(e.unit))
            .map((e) => e.unit)
        );
        const unc = v.after.uncertain.length - v.before.uncertain.length;
        if (loc) badges.push(["loc", `+${loc} locution${loc > 1 ? "s" : ""}`]);
        if (changedEmpties.size)
          badges.push([
            "emp",
            `+${changedEmpties.size} non traduit${changedEmpties.size > 1 ? "s" : ""}`
          ]);
        if (ident)
          badges.push([
            "id",
            `${ident} rattachement${ident > 1 ? "s" : ""} corrigé${ident > 1 ? "s" : ""}`
          ]);
        if (unc)
          badges.push([
            "unc",
            `${unc > 0 ? "+" : ""}${unc} incertain${Math.abs(unc) > 1 ? "s" : ""}`
          ]);
        if (other || removed)
          badges.push([
            "oth",
            `${other ? "+" + other : ""}${other && removed ? " / " : ""}${removed ? "−" + removed : ""} porteur${other + removed > 1 ? "s" : ""}`
          ]);
        return { badges, changedCarriers, changedEmpties };
      }

      function renderLine(view, side, verseIndex, changes) {
        const byWord = new Map();
        for (const [i, c] of view.carriers.entries())
          for (let w = c.start; w <= c.end; w++) {
            if (!byWord.has(w)) byWord.set(w, []);
            byWord.get(w).push(i);
          }
        // Untranslated (◎) and uncertain (◌) source words sit between the
        // target words, in source order when they share a position. An
        // uncertain word placed by the next source word leans on that word.
        const markersAt = new Map();
        const addMarker = (at, marker) => {
          if (!markersAt.has(at)) markersAt.set(at, []);
          markersAt.get(at).push(marker);
        };
        view.empties.forEach((e, i) =>
          addMarker(`after:${e.after}`, {
            kind: "empty",
            i,
            order: view.units[e.unit]?.order ?? 0
          })
        );
        view.uncertain.forEach((u, i) =>
          addMarker(
            u.basis === "next-source-word"
              ? `before:${u.after + 1}`
              : `after:${u.after}`,
            {
              kind: "uncertain",
              i,
              order: view.units[u.unit]?.order ?? 0
            }
          )
        );
        const markers = (at) =>
          (markersAt.get(at) || [])
            .sort((left, right) => left.order - right.order)
            .map(({ kind, i }) => {
              if (kind === "uncertain") {
                const u = view.uncertain[i];
                return `<span class="u" data-kind="uncertain" data-side="${side}" data-v="${verseIndex}" data-i="${i}" title="incertain : position estimée">◌<span class="s">${esc(u.strong)}</span></span>`;
              }
              const e = view.empties[i];
              const changed =
                side === "after" && changes?.changedEmpties.has(e.unit);
              return `<span class="e ${e.assurance === "linguistic-rule" ? "rule" : ""} ${changed ? "changed" : ""}" data-kind="empty" data-side="${side}" data-v="${verseIndex}" data-i="${i}" title="non traduit">◎<span class="s">${esc(e.strong)}</span></span>`;
            })
            .join("");
        let html = markers("after:-1");
        for (const seg of view.segments) {
          if (seg.w === undefined) {
            html += esc(seg.t);
            continue;
          }
          html += markers(`before:${seg.w}`);
          const ids = byWord.get(seg.w) || [];
          if (!ids.length) html += `<span class="w">${esc(seg.t)}</span>`;
          else {
            const c = view.carriers[ids[0]];
            const changed =
              side === "after" &&
              ids.some((i) =>
                changes?.changedCarriers.has(key(view.carriers[i]))
              );
            const labels = ids
              .filter((i) => view.carriers[i].end === seg.w)
              .map(
                (i) =>
                  `<span class="s" data-kind="carrier" data-side="${side}" data-v="${verseIndex}" data-i="${i}">${esc(view.carriers[i].strong)}</span>`
              )
              .join("");
            html += `<span class="w c ${kindOf(c)} ${changed ? "changed" : ""}" data-kind="carrier" data-side="${side}" data-v="${verseIndex}" data-i="${ids[0]}">${esc(seg.t)}</span>${labels}`;
          }
          html += markers(`after:${seg.w}`);
        }
        return `<div class="line">${html}</div>`;
      }

      function render() {
        const container = $("verses");
        document.body.classList.toggle("hide-numbers", !$("numbers").checked);
        document.body.classList.toggle(
          "hide-uncertain",
          !$("uncertain").checked
        );
        if (!state.verses.length) {
          container.innerHTML = `<div class="empty-state">Aucun verset.</div>`;
          return;
        }
        const onlyChanged = $("changedOnly").checked;
        const parts = [];
        for (const [i, v] of state.verses.entries()) {
          const changes = diff(v);
          if (onlyChanged && !changes.badges.length) continue;
          const badges = changes.badges
            .map(([k, t]) => `<span class="badge ${k}">${esc(t)}</span>`)
            .join("");
          let body;
          if (state.mode === "before")
            body = v.before
              ? renderLine(v.before, "before", i)
              : `<div class="note">Absent de la génération « avant ».</div>`;
          else if (state.mode === "after")
            body = renderLine(v.after, "after", i, changes);
          else
            body =
              `<div class="before"><div class="side">Avant</div>${v.before ? renderLine(v.before, "before", i) : ""}</div>` +
              `<div><div class="side">Après</div>${renderLine(v.after, "after", i, changes)}</div>`;
          parts.push(
            `<section class="verse" id="v${v.verse}"><div class="vhead"><span class="vnum">${esc(v.ref)}</span>${badges}</div>${body}</section>`
          );
        }
        container.innerHTML =
          parts.join("") ||
          `<div class="empty-state">Aucun verset modifié dans ce chapitre.</div>`;
      }

      function showDetail(target) {
        const v = state.verses[Number(target.dataset.v)];
        const view = target.dataset.side === "before" ? v.before : v.after;
        const i = Number(target.dataset.i);
        const kind = target.dataset.kind;
        let title,
          unitId,
          rows = [];
        if (kind === "carrier") {
          const c = view.carriers[i];
          const words = view.segments
            .filter((s) => s.w !== undefined && s.w >= c.start && s.w <= c.end)
            .map((s) => s.t)
            .join(" ");
          title = `${c.strong} sur « ${words} »`;
          unitId = c.unit;
          rows.push([
            "Origine",
            c.locution
              ? "locution entière d'un témoin (E)"
              : METHOD[c.method] ||
                (c.method.startsWith("lexical-gap-fill:")
                  ? `mot libre entre voisins placés (Q) : ${c.method.slice("lexical-gap-fill:".length)}`
                  : "") ||
                c.method ||
                c.source
          ]);
          rows.push([
            "Rattachement",
            c.positioned
              ? "par la position du témoin (F)"
              : "par proximité dans le verset"
          ]);
        } else if (kind === "empty") {
          const e = view.empties[i];
          title = `${e.strong} non traduit`;
          unitId = e.unit;
          rows.push(["Établi par", ASSURANCE[e.assurance] || e.assurance]);
        } else {
          const u = view.uncertain[i];
          title = `${u.strong} incertain`;
          unitId = u.unit;
          const previous = view.segments.find((s) => s.w === u.after);
          const next = view.segments.find((s) => s.w === u.after + 1);
          const where =
            u.basis === "next-source-word" && next
              ? `avant « ${next.t} »`
              : previous
                ? `après « ${previous.t} »`
                : "début du verset";
          rows.push(
            [
              "Position estimée",
              `${where} · ${UNCERTAIN_BASIS[u.basis] || u.basis}`
            ],
            [
              "Pourquoi",
              "aucune preuve suffisante d'un porteur ni d'une absence : il peut être rendu par un mot voisin, ou non traduit"
            ]
          );
        }
        const unit = unitId ? view.units[unitId] : undefined;
        if (unit) {
          rows.unshift(
            ["Mot source", `n° ${unit.position} du verset`],
            ["Glose", unit.gloss],
            ["Morphologie", unit.morphology]
          );
          rows.push([
            "Décision",
            `${unit.state === "visible" ? "placé" : unit.state === "empty" ? "non traduit" : "incertain"} · ${ASSURANCE[unit.assurance] || unit.assurance}`
          ]);
        }
        $("detailBody").innerHTML =
          `<h2>${esc(title)}</h2>${unit ? `<div class="src">${esc(word(unit.surface))}</div>` : ""}` +
          `<dl>${rows.map(([k, val]) => `<dt>${esc(k)}</dt><dd>${esc(val)}</dd>`).join("")}</dl>`;
        $("detail").classList.add("open");
      }

      function fillBooks() {
        const b = state.catalog.find((x) => x.id === state.bible);
        $("book").innerHTML = b.books
          .map(
            (x) =>
              `<option ${x.book === state.book ? "selected" : ""}>${x.book}</option>`
          )
          .join("");
        if (!b.books.some((x) => x.book === state.book))
          state.book = b.books[0].book;
        fillChapters();
      }
      function fillChapters() {
        const b = state.catalog.find((x) => x.id === state.bible);
        const n = b.books.find((x) => x.book === state.book).chapters;
        state.chapter = Math.min(state.chapter, n);
        $("chapter").innerHTML = Array.from(
          { length: n },
          (_, i) =>
            `<option ${i + 1 === state.chapter ? "selected" : ""}>${i + 1}</option>`
        ).join("");
      }

      async function load(scrollTo) {
        $("verses").innerHTML = `<div class="empty-state">Chargement…</div>`;
        const params = new URLSearchParams({
          bible: state.bible,
          book: state.book,
          chapter: state.chapter
        });
        history.replaceState(
          null,
          "",
          `?${params}${scrollTo ? `#v${scrollTo}` : ""}`
        );
        state.verses = await api(`/api/chapter?${params}`);
        render();
        if (scrollTo) {
          const el = document.getElementById(`v${scrollTo}`);
          if (el) {
            el.scrollIntoView({ block: "center" });
            el.classList.add("flash");
            setTimeout(() => el.classList.remove("flash"), 2500);
          }
        } else window.scrollTo(0, 0);
      }

      function step(delta) {
        const b = state.catalog.find((x) => x.id === state.bible);
        let bi = b.books.findIndex((x) => x.book === state.book);
        let c = state.chapter + delta;
        if (c < 1) {
          if (bi === 0) return;
          bi--;
          c = b.books[bi].chapters;
        } else if (c > b.books[bi].chapters) {
          if (bi === b.books.length - 1) return;
          bi++;
          c = 1;
        }
        state.book = b.books[bi].book;
        state.chapter = c;
        fillBooks();
        load();
      }

      async function init() {
        state.catalog = await api("/api/catalog");
        if (!state.catalog.length) {
          $("verses").innerHTML =
            `<div class="empty-state">Aucune génération vérifiée trouvée.</div>`;
          return;
        }
        const q = new URLSearchParams(location.search);
        state.bible =
          q.get("bible") && state.catalog.some((b) => b.id === q.get("bible"))
            ? q.get("bible")
            : state.catalog[0].id;
        state.book = q.get("book") || "Gen";
        state.chapter = Number(q.get("chapter") || 1);
        $("bible").innerHTML = state.catalog
          .map(
            (b) =>
              `<option value="${b.id}" ${b.id === state.bible ? "selected" : ""}>${esc(b.label)}</option>`
          )
          .join("");
        $("examples").innerHTML =
          "Exemples :" +
          EXAMPLES.filter(([bible]) =>
            state.catalog.some((b) => b.id === bible)
          )
            .map(
              ([bible, book, chapter, verse, label], i) =>
                `<button data-example="${i}">${bible.toUpperCase()} ${book} ${chapter}.${verse} — ${esc(label)}</button>`
            )
            .join("");
        fillBooks();
        stats();
        await load(location.hash ? Number(location.hash.slice(2)) : undefined);
      }

      $("bible").addEventListener("change", (e) => {
        state.bible = e.target.value;
        fillBooks();
        stats();
        load();
      });
      $("book").addEventListener("change", (e) => {
        state.book = e.target.value;
        state.chapter = 1;
        fillChapters();
        load();
      });
      $("chapter").addEventListener("change", (e) => {
        state.chapter = Number(e.target.value);
        load();
      });
      $("prev").addEventListener("click", () => step(-1));
      $("next").addEventListener("click", () => step(1));
      for (const id of ["numbers", "uncertain", "changedOnly"])
        $(id).addEventListener("change", render);
      document.querySelectorAll(".seg button").forEach((button) =>
        button.addEventListener("click", () => {
          document
            .querySelectorAll(".seg button")
            .forEach((b) => b.classList.toggle("on", b === button));
          state.mode = button.dataset.mode;
          render();
        })
      );
      $("examples").addEventListener("click", (e) => {
        const button = e.target.closest("button[data-example]");
        if (!button) return;
        const [bible, book, chapter, verse] =
          EXAMPLES[Number(button.dataset.example)];
        state.bible = bible;
        state.book = book;
        state.chapter = chapter;
        $("bible").value = bible;
        fillBooks();
        stats();
        load(verse);
      });
      document.addEventListener("click", (e) => {
        const target = e.target.closest("[data-kind]");
        if (target) {
          showDetail(target);
          return;
        }
        if (!e.target.closest("#detail")) $("detail").classList.remove("open");
      });
      document
        .querySelector("#detail .close")
        .addEventListener("click", () => $("detail").classList.remove("open"));
      init().catch((error) => {
        $("verses").innerHTML =
          `<div class="empty-state">Erreur : ${esc(error.message)}</div>`;
      });
    </script>
  </body>
</html>
