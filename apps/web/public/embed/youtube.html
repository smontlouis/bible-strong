<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Lecteur vidéo YouTube</title>

    <style>
      html,
      body,
      #player {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .error {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        color: #fff;
        font-family: sans-serif;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div id="player"></div>

    <script>
      const player = document.getElementById('player')
      const searchParams = new URLSearchParams(window.location.search)
      const videoId = searchParams.get('v') || ''
      const requestedAppId = searchParams.get('appId') || ''
      const appId = /^[A-Za-z0-9.-]+$/.test(requestedAppId)
        ? requestedAppId
        : 'com.smontlouis.biblestrong'

      if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
        player.className = 'error'
        player.textContent = 'Identifiant vidéo invalide'
      } else {
        const playerParams = new URLSearchParams({
          autoplay: '1',
          playsinline: '1',
          rel: '0',
          origin: window.location.origin,
          widget_referrer: `https://${appId}`,
        })
        const iframe = document.createElement('iframe')

        iframe.src =
          `https://www.youtube.com/embed/${encodeURIComponent(videoId)}` +
          `?${playerParams.toString()}`
        iframe.title = 'Lecteur vidéo YouTube'
        iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'
        iframe.allowFullscreen = true
        iframe.referrerPolicy = 'strict-origin-when-cross-origin'

        player.appendChild(iframe)
      }
    </script>
  </body>
</html>
