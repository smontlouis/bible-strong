name: PR Preview

# Manual only: publishing an EAS Update on every PR push is not wanted.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to publish a preview for
        required: true
        type: number

concurrency:
  group: pr-preview-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  publish-update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check for Expo token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add an EXPO_TOKEN repository secret before publishing PR previews."
            exit 1
          fi

      - name: Resolve PR branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_ref=$(gh pr view "${{ inputs.pr_number }}" --repo "${{ github.repository }}" --json headRefName --jq .headRefName)
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Load development environment
        run: |
          yarn workspace @bible-strong/expo dotenv -c development -- node -e '
            const fs = require("node:fs")
            const keys = [
              "ANDROID_GOOGLE_SERVICES_FILE",
              "APP_NAME",
              "BUNDLE_IDENTIFIER",
              "EXPO_PUBLIC_SENTRY_DSN",
              "IOS_GOOGLE_SERVICES_FILE",
            ]
            const values = keys.map(key => `${key}=${process.env[key] ?? ""}`)
            values.push("EXPO_NO_BUNDLE_SPLITTING=true")
            fs.appendFileSync(process.env.GITHUB_ENV, `${values.join("\n")}\n`)
          '

      - name: Publish preview update
        id: preview
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --auto
          working-directory: apps/expo
          # The action can only comment on pull_request events; comment below instead.
          comment: false

      - name: Comment preview on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_COMMENT: ${{ steps.preview.outputs.comment }}
        run: gh pr comment "${{ inputs.pr_number }}" --repo "${{ github.repository }}" --body "$PREVIEW_COMMENT"
