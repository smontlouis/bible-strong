name: Desktop release

# Builds the desktop app (ADR-0107) for macOS, Windows and Linux into the GitHub release
# `desktop-v<version>`, the app's version from apps/expo/package.json, then publishes it and points the
# readers' updaters at it once all three systems built. With `draft`, it stops at the draft so
# the installers can be tested; `Desktop promote` publishes it later. Started by
# `yarn desktop:release [--draft]` (docs/desktop-release.md).

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Stop at the draft release, to test the installers before publishing
        type: boolean
        default: false

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Check the version
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Refuse a version already published
        id: version
        run: |
          version=$(node -p "require('./apps/expo/package.json').version")
          published=$(gh release view "desktop-v$version" --json isDraft --jq '.isDraft | not' 2>/dev/null || true)
          if [ "$published" = "true" ]; then
            echo "desktop-v$version is already published: raise the version in apps/expo/package.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Yarn builds each Git dependency into an archive whose checksum the lockfile pins. Windows packs
  # it differently (file modes, compiler output) and fails that checksum (YN0018), so the Windows
  # build takes the archives packed here on Linux, which match.
  git-dependencies:
    name: Pack the Git dependencies
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Fetch the dependencies
        run: yarn install --immutable --mode=skip-build

      # With the patched packages: react-native-track-player is patched, and its patched archive
      # has its own checksum.
      - name: Keep the archives of the Git dependencies
        run: |
          cache="$(yarn config get cacheFolder)"
          mkdir git-dependencies
          cp "$cache"/*-https-*.zip "$cache"/*-patch-*.zip git-dependencies/
          ls git-dependencies

      - name: Hand them to the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: git-dependencies
          path: git-dependencies
          retention-days: 1

  build:
    name: Build ${{ matrix.name }}
    needs: [prepare, git-dependencies]
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.provisioned.conf.json
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            runner: windows-latest
            args: ''
            rust-targets: ''
          - name: Linux
            runner: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Refuse a build that could not install Offline copies
        shell: bash
        env:
          BIBLE_STRONG_ARCHIVE_KEYS: ${{ secrets.BIBLE_STRONG_ARCHIVE_KEYS }}
        run: |
          if [ -z "$BIBLE_STRONG_ARCHIVE_KEYS" ]; then
            echo "The BIBLE_STRONG_ARCHIVE_KEYS secret is missing" >&2
            exit 1
          fi

      - name: Write the App Store Connect key for notarization
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$GITHUB_WORKSPACE/apple-api-key.p8"

      # Without it macOS ignores the associated-domains entitlement, and links to bible-strong.app
      # would stop opening the app (ADR-0082): better no release than that one.
      - name: Write the Developer ID provisioning profile
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$APPLE_PROVISIONING_PROFILE" ]; then
            echo "The APPLE_PROVISIONING_PROFILE secret is missing" >&2
            exit 1
          fi
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > apps/desktop/src-tauri/embedded.provisionprofile

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install the Linux webview and bundler dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Take the Git dependencies packed on Linux
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: git-dependencies
          path: git-dependencies

      - name: Put them in the Yarn cache
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cache="$(yarn config get cacheFolder)"
          mkdir -p "$cache"
          cp git-dependencies/*.zip "$cache/"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Export the web app for desktop
        run: node apps/desktop/scripts/export-web.mjs

      - name: Build, sign and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIBLE_STRONG_ARCHIVE_KEYS: ${{ secrets.BIBLE_STRONG_ARCHIVE_KEYS }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/apple-api-key.p8
        with:
          projectPath: apps/desktop
          tauriScript: yarn tauri
          args: ${{ matrix.args }}
          tagName: desktop-v__VERSION__
          releaseName: Bible Strong desktop __VERSION__
          releaseBody: Bible Strong for macOS, Windows and Linux.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    name: Publish
    # Only when all three systems built: a reader never gets a release missing their system.
    needs: [prepare, build]
    if: ${{ !inputs.draft }}
    runs-on: ubuntu-latest
    environment: desktop-release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Publish and point the updaters at it
        uses: ./.github/actions/publish-desktop-release
        with:
          version: ${{ needs.prepare.outputs.version }}
