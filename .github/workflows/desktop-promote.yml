name: Desktop promote

# Publishes a draft desktop release kept by `Desktop release` (its `draft` option), once its
# installers were tested, and points the readers' updaters at it. Started by
# `yarn desktop:release --publish` (docs/desktop-release.md).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version to publish, for example 0.1.0
        required: true

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: desktop-release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Publish and point the updaters at it
        uses: ./.github/actions/publish-desktop-release
        with:
          version: ${{ inputs.version }}
