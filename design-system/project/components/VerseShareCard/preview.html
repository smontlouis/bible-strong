<!-- @dsCard group="Share cards" width=1200 height=630 subtitle="The image shown when a verse link is shared" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; }
  .frame { position: relative; display: flex; flex-direction: column; justify-content: space-between; width: 1200px; height: 630px; padding: 64px 72px; overflow: hidden; box-sizing: border-box; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
  /* The ring and the dot of the mark, enlarged, cut by the corner and pale: the brand blue at 12%. */
  .mark { position: absolute; right: -230px; top: -150px; width: 760px; height: 760px; opacity: 0.12; }
  .mark .ring { fill: none; stroke: var(--brand); }
  .mark .dot { fill: var(--brand); }
  .head { position: relative; display: flex; align-items: center; gap: 20px; }
  .reference { color: var(--accent); font-size: 44px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; }
  .chip { padding: 6px 16px; border-radius: var(--radius-pill); background: var(--accent-soft); color: var(--accent-ink); font-size: 22px; font-weight: 600; }
  .verse { position: relative; max-width: 900px; margin: 0; font-family: var(--font-serif); font-size: 52px; line-height: 1.32; font-weight: 400; text-wrap: pretty; }
  .lockup { position: relative; display: inline-flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; }
  .lockup svg { flex: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="bs-ring" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <symbol id="bs-mark" viewBox="0 0 102 102">
      <circle cx="51" cy="51" r="51" fill="#ffffff"/>
      <circle cx="51" cy="51" r="47.13" fill="none" stroke="url(#bs-ring)" stroke-width="7.74"/>
      <circle cx="51" cy="51" r="23.5" style="fill: var(--brand)"/>
    </symbol>
  </defs>
</svg>
<div class="frame" data-theme="light">
  <svg class="mark" viewBox="0 0 760 760" aria-hidden="true">
    <circle class="ring" cx="380" cy="380" r="350" stroke-width="58"/>
    <circle class="dot" cx="380" cy="380" r="176"/>
  </svg>
  <div class="head"><span class="reference">Jean 3:16</span><span class="chip">LSG</span></div>
  <p class="verse">Car Dieu a tant aimé le monde qu’il a donné son Fils unique, afin que quiconque croit en lui ne périsse point, mais qu’il ait la vie éternelle.</p>
  <span class="lockup"><svg width="44" height="44" aria-hidden="true"><use href="#bs-mark"/></svg>Bible Strong</span>
</div>
</body>
</html>
