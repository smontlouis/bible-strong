<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .grounds { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .ground { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 28px 24px; background: var(--canvas); color: var(--ink); }
  .chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 12px; border-radius: var(--radius-pill); background: var(--accent-soft); color: var(--accent-ink); font-size: 0.85rem; line-height: 20px; }
  .chip b { font-weight: 600; }
</style>
</head>
<body>
<div class="grounds">
  <div class="ground" data-theme="light"><span class="chip"><b>G26</b> agapē</span><span class="chip">Nom féminin</span><span class="chip"><b>118</b> occurrences</span></div>
  <div class="ground" data-theme="dark"><span class="chip"><b>G26</b> agapē</span><span class="chip">Nom féminin</span><span class="chip"><b>118</b> occurrences</span></div>
</div>
</body>
</html>
